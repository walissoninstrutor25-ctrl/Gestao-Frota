<!DOCTYPE html>
<!-- APP_BUILD:2026-09-09T00-00-00Z -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Finanças Pessoais</title>
<link rel="manifest" href="manifest-financas.webmanifest">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="assets/financas-logo-192.png">
<link rel="apple-touch-icon" href="assets/financas-logo-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f4f5fb;
    --surface:#ffffff;
    --surface-2:#f8f8fc;
    --line:#e6e5f0;
    --line-soft:#eef0f8;
    --text:#1c1a29;
    --text-muted:#6b6880;
    --text-faint:#a29fb3;
    --accent:#4f46e5;
    --accent-2:#7c3aed;
    --accent-soft:#eeecfd;
    --accent-ink:#ffffff;
    --income:#16a34a;
    --income-soft:#dcfce7;
    --expense:#e11d48;
    --expense-soft:#ffe4e9;
    --warning:#d97706;
    --warning-soft:#fef3c7;
    --radius:14px;
    --radius-sm:9px;
    --shadow:0 1px 2px rgba(28,26,41,0.04), 0 8px 24px -12px rgba(28,26,41,0.12);
    --shadow-lg:0 12px 40px -12px rgba(28,26,41,0.22);
    color-scheme: light;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#0f0e17;
      --surface:#181624;
      --surface-2:#1e1b2c;
      --line:#2c2840;
      --line-soft:#242038;
      --text:#f1f0f7;
      --text-muted:#a7a3bd;
      --text-faint:#716d8a;
      --accent:#8280f8;
      --accent-2:#a78bfa;
      --accent-soft:#282350;
      --accent-ink:#ffffff;
      --income:#4ade80;
      --income-soft:#123321;
      --expense:#fb7185;
      --expense-soft:#3a1220;
      --warning:#fbbf24;
      --warning-soft:#3a2c0f;
      --shadow:0 1px 2px rgba(0,0,0,0.2), 0 8px 24px -12px rgba(0,0,0,0.5);
      --shadow-lg:0 12px 40px -12px rgba(0,0,0,0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f0e17;
    --surface:#181624;
    --surface-2:#1e1b2c;
    --line:#2c2840;
    --line-soft:#242038;
    --text:#f1f0f7;
    --text-muted:#a7a3bd;
    --text-faint:#716d8a;
    --accent:#8280f8;
    --accent-2:#a78bfa;
    --accent-soft:#282350;
    --accent-ink:#ffffff;
    --income:#4ade80;
    --income-soft:#123321;
    --expense:#fb7185;
    --expense-soft:#3a1220;
    --warning:#fbbf24;
    --warning-soft:#3a2c0f;
    --shadow:0 1px 2px rgba(0,0,0,0.2), 0 8px 24px -12px rgba(0,0,0,0.5);
    --shadow-lg:0 12px 40px -12px rgba(0,0,0,0.6);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Manrope',sans-serif; margin:0; font-weight:800; letter-spacing:-0.01em;}
  .mono{font-family:'Roboto Mono',monospace; font-variant-numeric:tabular-nums;}
  ::selection{background:var(--accent); color:#fff;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- primitives ---------- */
  .btn{
    cursor:pointer; border:none; border-radius:10px; padding:10px 16px;
    font-weight:600; font-size:13.5px; letter-spacing:0.01em; display:inline-flex;
    align-items:center; gap:8px; transition:transform .08s ease, filter .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; color:var(--text-muted); border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--text); border-color:var(--text-faint);}
  .btn-soft{background:var(--accent-soft); color:var(--accent);}
  .btn-soft:hover{filter:brightness(1.05);}
  .btn-danger{background:var(--expense-soft); color:var(--expense);}
  .btn-danger:hover{filter:brightness(0.96);}
  .btn-sm{padding:7px 11px; font-size:12.5px; border-radius:8px;}
  .btn-icon{padding:9px; border-radius:10px;}
  .btn-block{width:100%; justify-content:center;}
  .btn:disabled{opacity:0.55; cursor:not-allowed;}

  label{display:block; font-size:12.5px; font-weight:600; color:var(--text-muted); margin:0 0 6px;}
  input,select,textarea{
    font-family:'Inter',sans-serif; width:100%; background:var(--surface-2); color:var(--text);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  input[type="checkbox"]{width:auto;}
  .field{margin-bottom:14px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .hint{font-size:11.5px; color:var(--text-faint); margin-top:5px;}
  .error-text{font-size:12.5px; color:var(--expense); margin-top:6px; min-height:1px;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .card-pad{padding:18px;}

  .badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700; letter-spacing:0.02em;}
  .badge-income{background:var(--income-soft); color:var(--income);}
  .badge-expense{background:var(--expense-soft); color:var(--expense);}
  .badge-warning{background:var(--warning-soft); color:var(--warning);}
  .badge-neutral{background:var(--surface-2); color:var(--text-muted); border:1px solid var(--line);}

  .empty-state{padding:48px 20px; text-align:center; color:var(--text-faint);}
  .empty-state .icn{font-size:34px; margin-bottom:10px; opacity:0.8;}
  .empty-state p{margin:4px 0 16px; font-size:13.5px;}

  .progress{height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; border:1px solid var(--line-soft);}
  .progress > i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--accent-2));}

  .divider{height:1px; background:var(--line); margin:16px 0; border:none;}

  /* ---------- app layout ---------- */
  #authScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    background:
      radial-gradient(circle at 12% 8%, rgba(79,70,229,0.14), transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(124,58,237,0.12), transparent 45%),
      var(--bg);
  }
  .auth-box{width:100%; max-width:400px;}
  .auth-logo{display:flex; align-items:center; gap:10px; margin-bottom:22px; justify-content:center;}
  .auth-logo img{width:40px; height:40px; border-radius:11px;}
  .auth-logo span{font-family:'Manrope',sans-serif; font-weight:800; font-size:19px;}
  .auth-tabs{display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:4px; margin-bottom:20px;}
  .auth-tab{flex:1; text-align:center; padding:9px; border-radius:9px; font-size:13.5px; font-weight:700; cursor:pointer; color:var(--text-muted);}
  .auth-tab.active{background:var(--surface); color:var(--accent); box-shadow:var(--shadow);}
  .household-choice{display:flex; gap:8px; margin-bottom:14px;}
  .household-choice label{flex:1; display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:12.5px; font-weight:600; color:var(--text); cursor:pointer; margin:0;}
  .household-choice input{width:auto;}
  .household-choice label.active{border-color:var(--accent); background:var(--accent-soft); color:var(--accent);}

  #appShell{display:none; min-height:100vh;}
  #appShell.on{display:flex;}
  .sidebar{width:236px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--line); padding:18px 14px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;}
  .brand{display:flex; align-items:center; gap:10px; padding:6px 8px 20px;}
  .brand img{width:32px; height:32px; border-radius:9px;}
  .brand b{font-family:'Manrope',sans-serif; font-weight:800; font-size:15.5px;}
  .nav-item{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; color:var(--text-muted); font-weight:600; font-size:13.5px; cursor:pointer; margin-bottom:2px;}
  .nav-item svg{width:18px; height:18px; flex-shrink:0;}
  .nav-item:hover{background:var(--surface-2); color:var(--text);}
  .nav-item.active{background:var(--accent-soft); color:var(--accent);}
  .sidebar-foot{margin-top:auto; display:flex; flex-direction:column; gap:4px;}

  .main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 22px; display:flex; align-items:center; justify-content:space-between; gap:14px; backdrop-filter:blur(6px);}
  .topbar h1{font-size:19px;}
  .month-switch{display:flex; align-items:center; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:4px;}
  .month-switch button{background:transparent; border:none; cursor:pointer; color:var(--text-muted); padding:6px 8px; border-radius:7px; display:flex;}
  .month-switch button:hover{background:var(--surface-2); color:var(--text);}
  .month-switch .lbl{font-weight:700; font-size:13px; padding:0 6px; min-width:118px; text-align:center; text-transform:capitalize;}
  .topbar-right{display:flex; align-items:center; gap:8px;}
  .avatar{width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;}

  #view{padding:22px; flex:1;}
  .view-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  .view-head h2{font-size:21px;}
  .view-head p{margin:3px 0 0; color:var(--text-muted); font-size:13px;}

  .grid-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px;}
  .stat-card{padding:16px 18px;}
  .stat-card .lbl{font-size:12px; color:var(--text-muted); font-weight:600; display:flex; align-items:center; gap:6px;}
  .stat-card .val{font-family:'Roboto Mono',monospace; font-size:22px; font-weight:700; margin-top:8px; letter-spacing:-0.01em;}
  .grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:14px;}
  .grid-charts{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}

  .list-row{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line-soft);}
  .list-row:last-child{border-bottom:none;}
  .list-row .ic{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;}
  .list-row .body{flex:1; min-width:0;}
  .list-row .body .t{font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .list-row .body .s{font-size:12px; color:var(--text-muted); margin-top:2px;}
  .list-row .amt{font-family:'Roboto Mono',monospace; font-weight:700; font-size:13.5px; flex-shrink:0;}
  .list-row .amt.exp{color:var(--expense);}
  .list-row .amt.inc{color:var(--income);}
  .list-row .actions{display:flex; gap:4px; flex-shrink:0;}
  .icon-btn{background:transparent; border:none; cursor:pointer; color:var(--text-faint); padding:6px; border-radius:7px; display:flex;}
  .icon-btn:hover{background:var(--surface-2); color:var(--text);}
  .icon-btn.danger:hover{background:var(--expense-soft); color:var(--expense);}

  .toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
  .toolbar select, .toolbar input{width:auto; min-width:130px;}
  .toolbar .grow{flex:1; min-width:180px;}
  .chip-filter{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{padding:6px 12px; border-radius:999px; font-size:12px; font-weight:700; background:var(--surface); border:1px solid var(--line); color:var(--text-muted); cursor:pointer;}
  .chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}

  table{width:100%; border-collapse:collapse;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-faint); font-weight:700; padding:0 10px 10px;}
  td{padding:11px 10px; border-top:1px solid var(--line-soft); font-size:13.5px;}
  tr:hover td{background:var(--surface-2);}
  .table-wrap{overflow-x:auto;}

  /* ---------- modal & toast ---------- */
  #modalRoot{position:fixed; inset:0; z-index:100; display:none; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto;}
  #modalRoot.on{display:flex;}
  .modal-overlay{position:fixed; inset:0; background:rgba(15,14,23,0.5); backdrop-filter:blur(2px);}
  .modal-box{position:relative; background:var(--surface); border-radius:16px; width:100%; max-width:460px; box-shadow:var(--shadow-lg); animation:pop .15s ease;}
  @keyframes pop{from{opacity:0; transform:translateY(6px) scale(0.98);} to{opacity:1; transform:none;}}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--line);}
  .modal-head h3{font-size:16.5px;}
  .modal-body{padding:20px; max-height:66vh; overflow-y:auto;}
  .modal-foot{display:flex; justify-content:flex-end; gap:8px; padding:16px 20px; border-top:1px solid var(--line);}

  #toastRoot{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center;}
  .toast{background:var(--text); color:var(--bg); padding:11px 18px; border-radius:10px; font-size:13px; font-weight:600; box-shadow:var(--shadow-lg); animation:toastin .18s ease;}
  .toast.err{background:var(--expense);}
  .toast.ok{background:var(--income);}
  @keyframes toastin{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

  /* ---------- mobile ---------- */
  .bottom-nav{display:none;}
  .menu-toggle{display:none;}
  @media (max-width: 900px){
    .sidebar{position:fixed; left:0; top:0; bottom:0; z-index:60; transform:translateX(-100%); transition:transform .2s ease; box-shadow:var(--shadow-lg);}
    .sidebar.open{transform:none;}
    .menu-toggle{display:flex;}
    .grid-stats{grid-template-columns:1fr 1fr;}
    .grid-2, .grid-charts{grid-template-columns:1fr;}
    .field-row{grid-template-columns:1fr;}
    #view{padding:14px 14px 84px;}
    .topbar{padding:12px 14px;}
    .bottom-nav{display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--line); z-index:50; padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);}
    .bottom-nav .nav-item{flex-direction:column; gap:3px; flex:1; text-align:center; font-size:10px; padding:6px 2px; margin:0; border-radius:10px;}
    .bottom-nav .nav-item svg{width:19px; height:19px;}
    .sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:55;}
    .sidebar-scrim.on{display:block;}
    .month-switch .lbl{min-width:0;}
  }
  @media (max-width: 560px){
    .grid-stats{grid-template-columns:1fr 1fr;}
    .stat-card .val{font-size:18px;}
  }

  @media print{
    .sidebar,.topbar,.bottom-nav,#modalRoot,#toastRoot,.no-print{display:none !important;}
    #view{padding:0;}
    body{background:#fff;}
  }
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-box">
    <div class="auth-logo"><img src="assets/financas-logo-192.png" alt=""><span>Finanças Pessoais</span></div>
    <div class="card card-pad">
      <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin" onclick="setAuthTab('login')">Entrar</div>
        <div class="auth-tab" id="tabSignup" onclick="setAuthTab('signup')">Criar conta</div>
      </div>

      <form id="formLogin" onsubmit="return handleLogin(event)">
        <div class="field"><label>E-mail</label><input type="email" id="loginEmail" required autocomplete="email"></div>
        <div class="field"><label>Senha</label><input type="password" id="loginPass" required autocomplete="current-password"></div>
        <div class="error-text" id="loginError"></div>
        <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Entrar</button>
      </form>

      <form id="formSignup" style="display:none" onsubmit="return handleSignup(event)">
        <div class="field"><label>Seu nome</label><input type="text" id="suName" required></div>
        <div class="field"><label>E-mail</label><input type="email" id="suEmail" required autocomplete="email"></div>
        <div class="field"><label>Senha</label><input type="password" id="suPass" required minlength="6" autocomplete="new-password"></div>
        <div class="field">
          <label>Lar financeiro</label>
          <div class="household-choice">
            <label class="active" id="choiceNewLbl"><input type="radio" name="hhChoice" value="new" checked onchange="onHhChoice()"> Criar novo</label>
            <label id="choiceJoinLbl"><input type="radio" name="hhChoice" value="join" onchange="onHhChoice()"> Já tenho código</label>
          </div>
          <input type="text" id="suCode" placeholder="Código do lar (ex: K3F9QX)" style="display:none; margin-top:8px; text-transform:uppercase;" maxlength="6">
          <p class="hint">Um "lar" é o espaço compartilhado de finanças. Crie um novo e convide seu parceiro(a) com o código gerado, ou entre com um código que já recebeu.</p>
        </div>
        <div class="error-text" id="signupError"></div>
        <button class="btn btn-primary btn-block" type="submit" id="signupBtn">Criar conta</button>
      </form>
    </div>
    <p class="hint" style="text-align:center; margin-top:14px;">Seus dados ficam privados no seu lar financeiro, protegidos por login.</p>
  </div>
</div>

<div id="appShell">
  <div class="sidebar-scrim" id="sidebarScrim" onclick="toggleSidebar(false)"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img src="assets/financas-logo-192.png" alt=""><b>Finanças</b></div>
    <nav id="navList"></nav>
    <div class="sidebar-foot">
      <div class="nav-item" onclick="toggleTheme()" id="themeToggleBtn"></div>
      <div class="nav-item" onclick="handleLogout()" id="logoutBtn"></div>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="btn btn-icon btn-ghost menu-toggle" onclick="toggleSidebar()" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 id="viewTitle">Painel</h1>
      </div>
      <div class="topbar-right">
        <div class="month-switch" id="monthSwitch">
          <button onclick="shiftMonth(-1)" aria-label="Mês anterior">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="lbl" id="monthLabel">—</span>
          <button onclick="shiftMonth(1)" aria-label="Próximo mês">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <div class="avatar" id="userAvatar">?</div>
      </div>
    </header>
    <main id="view"></main>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<div id="modalRoot"><div class="modal-overlay" onclick="closeModal()"></div><div class="modal-box" id="modalBox"></div></div>
<div id="toastRoot"></div>

<script>
/* =========================================================
   FIREBASE INIT
   Reaproveita o mesmo projeto Firebase do app de frota (LOTS),
   isolado em coleções próprias com prefixo "fin_" para não
   colidir com os dados da frota.

const $ = sel => document.querySelector(sel);

function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
function fmtMoney(v){ return BRL.format(Number(v)||0); }
function fmtDateBR(d){
  if(!d) return '';
  const dt = (d instanceof Date) ? d : new Date(d);
  if(isNaN(dt)) return '';
  return dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
const MONTH_NAMES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function ymNow(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function ymLabel(ym){ const [y,m] = ym.split('-').map(Number); return `${MONTH_NAMES[m-1]} ${y}`; }
function ymAdd(ym,n){ const [y,m]=ym.split('-').map(Number); const d=new Date(y, (m-1)+n, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function ymDiff(a,b){ const [ay,am]=a.split('-').map(Number); const [by,bm]=b.split('-').map(Number); return (by-ay)*12+(bm-am); }
function ymDate(ym, day){ const [y,m]=ym.split('-').map(Number); const last = new Date(y,m,0).getDate(); return new Date(y, m-1, Math.min(day||1,last)); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function uid8(){ return Math.random().toString(36).slice(2,10); }
function genHouseholdCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast' + (type?(' '+type):'');
  el.textContent = msg;
  $('#toastRoot').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 2600);
}

async function handleLogin(ev){
  ev.preventDefault();
  const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'Entrando…';
  $('#loginError').textContent = '';
  try{
    await auth.signInWithEmailAndPassword($('#loginEmail').value.trim(), $('#loginPass').value);
  }catch(err){
    $('#loginError').textContent = authErrorMsg(err);
  }finally{
    btn.disabled = false; btn.textContent = 'Entrar';
  }
  return false;
}

async function handleSignup(ev){
  ev.preventDefault();
  const btn = $('#signupBtn'); btn.disabled = true; btn.textContent = 'Criando…';
  $('#signupError').textContent = '';
  const name = $('#suName').value.trim();
  const email = $('#suEmail').value.trim();
  const pass = $('#suPass').value;
  const joining = $('input[name="hhChoice"]:checked').value === 'join';
  const code = $('#suCode').value.trim().toUpperCase();
  let cred = null;
  try{
    if(joining && !code) throw {code:'custom', message:'Informe o código do lar.'};

    cred = await auth.createUserWithEmailAndPassword(email, pass);
    const uidVal = cred.user.uid;
    // garante que o token novo já propagou para o cliente do Firestore antes de escrever,
    // evitando um "permission-denied" de corrida logo após o cadastro.
    await cred.user.getIdToken(true);

    if(joining){
      const hhRef = db.collection('fin_households').doc(code);
      const snap = await hhRef.get();
      if(!snap.exists) throw {code:'custom', message:'Código do lar não encontrado. Confira e tente novamente.'};
      await hhRef.update({
        members: firebase.firestore.FieldValue.arrayUnion(uidVal),
        [`memberNames.${uidVal}`]: name
      });
      await db.collection('fin_users').doc(uidVal).set({name, email, householdId: code, createdAt: Date.now()});
    } else {
      let newCode;
      for(let i=0;i<6;i++){
        newCode = genHouseholdCode();
        const chk = await db.collection('fin_households').doc(newCode).get();
        if(!chk.exists) break;
      }
      const ref = db.collection('fin_households').doc(newCode);
      await ref.set({
        code:newCode, members:[uidVal], memberNames:{[uidVal]:name},
        initialBalance:0, initialBalanceMonth: ymNow(), createdAt: Date.now()
      });
      const batch = db.batch();
      DEFAULT_CATEGORIES.forEach(c=>{
        const cref = ref.collection('categories').doc();
        batch.set(cref, c);
      });
      await batch.commit();
      await db.collection('fin_users').doc(uidVal).set({name, email, householdId:newCode, createdAt: Date.now()});
    }
  }catch(err){
    $('#signupError').textContent = authErrorMsg(err);
    btn.disabled = false; btn.textContent = 'Criar conta';
    // se a conta chegou a ser criada mas o lar falhou (ex: código inválido),
    // remove a conta órfã em vez de deixar um usuário sem lar associado.
    if(cred && cred.user){ cred.user.delete().catch(()=>{}); }
  }
  return false;
}

function authErrorMsg(err){
  const code = (err && err.code) || '';
  if(code==='custom') return err.message;
  if(code.includes('email-already-in-use')) return 'Este e-mail já está cadastrado.';
  if(code.includes('invalid-email')) return 'E-mail inválido.';
  if(code.includes('weak-password')) return 'Senha muito curta (mínimo 6 caracteres).';
  if(code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) return 'E-mail ou senha incorretos.';
  if(code.includes('network')) return 'Falha de conexão. Verifique sua internet.';
  return 'Não foi possível concluir. Tente novamente.';
}

   ========================================================= */
auth.onAuthStateChanged(async user=>{
  state.unsub.forEach(u=>u()); state.unsub=[];
  if(!user){
    state.user=null; state.profile=null; state.household=null;
    $('#appShell').classList.remove('on');
    $('#authScreen').style.display='flex';
    return;
  }
  state.user = user;
  try{
    await user.getIdToken();
    // logo após o cadastro, este observador pode disparar antes de handleSignup()
    // terminar de gravar o documento do lar/perfil — tenta de novo por alguns
    // instantes em vez de concluir que a conta está quebrada.
    let pDoc = await db.collection('fin_users').doc(user.uid).get();
    for(let tries=0; !pDoc.exists && tries<8; tries++){
      await new Promise(r=>setTimeout(r, 350));
      pDoc = await db.collection('fin_users').doc(user.uid).get();
    }
    if(!pDoc.exists){ toast('Perfil não encontrado. Faça login novamente.','err'); await auth.signOut(); return; }
    state.profile = pDoc.data();
    $('#authScreen').style.display='none';
    $('#appShell').classList.add('on');
    $('#userAvatar').textContent = (state.profile.name||'?').trim().slice(0,1).toUpperCase();
    listenHousehold(state.profile.householdId);
    buildNav();
    applyTheme();
    router();
  }catch(err){
    console.error(err);
    toast('Erro ao carregar sua conta.','err');
  }
});

function listenHousehold(householdId){
  const hhRef = db.collection('fin_households').doc(householdId);
  const collections = ['categories','bills','billPayments','cards','purchases','transactions','goals'];
  state.unsub.push(hhRef.onSnapshot(doc=>{
    state.household = {id:doc.id, ...doc.data()};
    rerenderSoft();
  }));
  const stateKeyMap = {categories:'categories',bills:'bills',billPayments:'billPayments',cards:'cards',purchases:'purchases',transactions:'transactions',goals:'goals'};
  collections.forEach(cname=>{
    state.unsub.push(hhRef.collection(cname).onSnapshot(snap=>{
      state[stateKeyMap[cname]] = snap.docs.map(d=>({id:d.id, ...d.data()}));
      rerenderSoft();
    }, err=>console.error(cname, err)));
  });
}

const rerenderSoft = debounce(()=>{ if(state.household) ensureMonthGenerated(state.month).then(router); }, 120);

function hhCol(name){ return db.collection('fin_households').doc(state.household.id).collection(name); }
async function addDoc(colName, data){
  try{ await hhCol(colName).add({...data, createdAt: Date.now()}); return true; }
  catch(err){ console.error(err); toast('Erro ao salvar. Tente novamente.','err'); return false; }
}
async function setDoc(colName, id, data){
  try{ await hhCol(colName).doc(id).update(data); return true; }
  catch(err){ console.error(err); toast('Erro ao salvar. Tente novamente.','err'); return false; }
}
async function removeDoc(colName, id){
  try{ await hhCol(colName).doc(id).delete(); return true; }
  catch(err){ console.error(err); toast('Erro ao excluir. Tente novamente.','err'); return false; }
}

async function ensureMonthGenerated(ym){
  if(!state.household) return;
  const existing = new Set(state.billPayments.filter(bp=>bp.month===ym).map(bp=>bp.billId));
  const toCreate = state.bills.filter(b=>b.active!==false && !existing.has(b.id));
  if(!toCreate.length) return;
  try{
    const batch = db.batch();
    toCreate.forEach(b=>{
      const ref = hhCol('billPayments').doc();
      batch.set(ref, {
        billId:b.id, month:ym, name:b.name, category:b.category||null,
        amount:Number(b.amount)||0, dueDate: ymDate(ym,b.dueDay).toISOString(),
        paid:false, personId:b.personId||null, createdAt: Date.now()
      });
    });
    await batch.commit();
  }catch(err){ console.error('gerar mês', err); }
}

/* ---------- parcelamentos ---------- */
function installmentForMonth(purchase, ym){
  const idx = ymDiff(purchase.firstMonth, ym) + 1;
  if(idx < 1 || idx > purchase.installments) return null;
  const per = Math.round((purchase.totalAmount/purchase.installments)*100)/100;
  const isLast = idx === purchase.installments;
  const amount = isLast ? Math.round((purchase.totalAmount - per*(purchase.installments-1))*100)/100 : per;
  return {index:idx, amount, label:`${idx}/${purchase.installments}`};
}
